<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .kicker { fill: #58a6ff; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .name { fill: #f0f6fc; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
      .type-text { fill: #7ee787; font-size: 14px; font-weight: 600; }
      .chip-text { fill: #c9d1d9; font-size: 11px; font-weight: 600; }
      .status-text { fill: #7ee787; font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="220" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  <rect width="850" height="220" rx="10" fill="url(#grid)" />

  <!-- Top Accent Bar with flowing light -->
  <rect x="0" y="0" width="850" height="3" fill="url(#accent)" />
  <rect x="-120" y="0" width="120" height="3" fill="#ffffff" fill-opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="-120,0;950,0" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Left Section: Profile Info -->
  <g transform="translate(36, 42)">
    <!-- Kicker with Live Dot -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="5" cy="5" r="4" fill="none" stroke="#3fb950" stroke-width="1.2">
        <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="9" class="mono kicker">SOFTWARE QUALITY ASSURANCE &amp; AUTOMATION</text>
    </g>

    <!-- Name -->
    <text x="0" y="46" class="sans name">Arrofi Zein</text>

    <!-- Animated Cycling Subtitle / Dynamic Typing in pure SVG -->
    <g transform="translate(0, 76)">
      <text x="0" y="0" class="mono type-text" opacity="0">
        ⚡ Playwright &amp; Pytest Automation
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" class="mono type-text" opacity="0">
        🧪 Autonomous OpenAPI Contract &amp; Schema Testing
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.38;0.63;0.68;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" class="mono type-text" opacity="0">
        🚀 Multi-Stage CI/CD Quality Gates &amp; Accessibility (axe-core)
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.71;0.96;1;1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- Status Chip -->
    <g transform="translate(0, 100)">
      <rect width="180" height="24" rx="12" fill="#238636" fill-opacity="0.16" stroke="#2ea043" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
      <text x="24" y="16" class="mono status-text">ALL GATES: VERIFIED</text>
    </g>
  </g>

  <!-- Right Section: Interactive QA Spec Card -->
  <g transform="translate(560, 36)">
    <rect width="254" height="148" rx="8" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <rect width="254" height="26" rx="8" fill="#161b22" />
    <rect y="18" width="254" height="8" fill="#161b22" />
    <circle cx="14" cy="13" r="3.5" fill="#f85149" />
    <circle cx="26" cy="13" r="3.5" fill="#e3b341" />
    <circle cx="38" cy="13" r="3.5" fill="#2ea043" />
    <text x="54" y="17" class="mono" fill="#8b949e" font-size="11px">qa-specification.ts</text>

    <!-- Spec rows -->
    <g transform="translate(14, 42)">
      <g transform="translate(0, 0)">
        <rect width="226" height="26" rx="4" fill="#161b22" stroke="#21262d" stroke-width="0.8"/>
        <text x="10" y="17" class="mono chip-text">E2E Engine</text>
        <text x="216" y="17" class="mono" fill="#58a6ff" font-size="11px" font-weight="700" text-anchor="end">Playwright / Vitest</text>
      </g>

      <g transform="translate(0, 32)">
        <rect width="226" height="26" rx="4" fill="#161b22" stroke="#21262d" stroke-width="0.8"/>
        <text x="10" y="17" class="mono chip-text">API Testing</text>
        <text x="216" y="17" class="mono" fill="#3fb950" font-size="11px" font-weight="700" text-anchor="end">Pytest / Requests</text>
      </g>

      <g transform="translate(0, 64)">
        <rect width="226" height="26" rx="4" fill="#161b22" stroke="#21262d" stroke-width="0.8"/>
        <text x="10" y="17" class="mono chip-text">Accessibility</text>
        <text x="216" y="17" class="mono" fill="#d2a8ff" font-size="11px" font-weight="700" text-anchor="end">axe-core (WCAG AA)</text>
      </g>
    </g>
  </g>
</svg>
