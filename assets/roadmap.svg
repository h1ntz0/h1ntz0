<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-road" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .step-num { fill: #58a6ff; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .step-title { fill: #f0f6fc; font-size: 14px; font-weight: 600; }
      .step-desc { fill: #8b949e; font-size: 12px; }
      .tag-txt { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="150" rx="8" fill="url(#bg-grad-road)" stroke="#30363d" stroke-width="1" />

  <!-- 3 Roadmap Cards -->
  <!-- Card 1 -->
  <g transform="translate(20, 20)">
    <rect width="250" height="110" rx="6" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="250" height="3" rx="1.5" fill="#388bfd" />
    
    <text x="16" y="24" class="mono step-num">01 / ARCHITECTURE</text>
    <text x="16" y="46" class="sans step-title">Contract Testing</text>
    <text x="16" y="66" class="sans step-desc">Pact framework &amp; API schema</text>
    
    <!-- Tag Status -->
    <rect x="16" y="80" width="105" height="20" rx="10" fill="#388bfd" fill-opacity="0.15" stroke="#388bfd" stroke-width="0.8"/>
    <circle cx="26" cy="90" r="3" fill="#58a6ff" />
    <text x="34" y="94" class="mono tag-txt" fill="#58a6ff">IN PROGRESS</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(300, 20)">
    <rect width="250" height="110" rx="6" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="250" height="3" rx="1.5" fill="#a371f7" />
    
    <text x="16" y="24" class="mono step-num" fill="#bc8cff">02 / BENCHMARKING</text>
    <text x="16" y="46" class="sans step-title">Performance &amp; Load</text>
    <text x="16" y="66" class="sans step-desc">k6 metrics &amp; distributed testing</text>
    
    <!-- Tag Status -->
    <rect x="16" y="80" width="95" height="20" rx="10" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-width="0.8"/>
    <circle cx="26" cy="90" r="3" fill="#d2a8ff" />
    <text x="34" y="94" class="mono tag-txt" fill="#d2a8ff">EXPLORING</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(580, 20)">
    <rect width="250" height="110" rx="6" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="250" height="3" rx="1.5" fill="#2ea043" />
    
    <text x="16" y="24" class="mono step-num" fill="#3fb950">03 / CI/CD PIPELINE</text>
    <text x="16" y="46" class="sans step-title">Quality Matrix Gates</text>
    <text x="16" y="66" class="sans step-desc">Multi-stage GitHub Actions</text>
    
    <!-- Tag Status -->
    <rect x="16" y="80" width="95" height="20" rx="10" fill="#2ea043" fill-opacity="0.15" stroke="#2ea043" stroke-width="0.8"/>
    <circle cx="26" cy="90" r="3" fill="#3fb950" />
    <text x="34" y="94" class="mono tag-txt" fill="#3fb950">ACTIVE GATE</text>
  </g>
</svg>
