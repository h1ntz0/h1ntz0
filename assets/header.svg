<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e18" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .kicker { fill: #58a6ff; font-size: 13px; font-weight: 600; letter-spacing: 2.5px; }
      .name { fill: #f0f6fc; font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle { fill: #8b949e; font-size: 14px; font-weight: 500; }
      .status-text { fill: #7ee787; font-size: 12px; font-weight: 700; }
      .win-label { fill: #8b949e; font-size: 11px; }
      .row-label { fill: #c9d1d9; font-size: 12px; font-weight: 600; }
      .row-val { fill: #7ee787; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="210" rx="14" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1" />
  <rect width="850" height="210" rx="14" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="3" fill="url(#accent-grad)" />

  <!-- Left: Identity -->
  <g transform="translate(42, 46)">
    <text x="0" y="0" class="mono kicker">QUALITY ASSURANCE &amp; TEST AUTOMATION</text>
    <text x="0" y="46" class="sans name">Arrofi Zein</text>
    <text x="0" y="76" class="mono subtitle">E2E Testing · API Automation · CI/CD Quality Gates · Reliability</text>

    <!-- Status Badge -->
    <g transform="translate(0, 98)">
      <rect width="190" height="30" rx="15" fill="#238636" fill-opacity="0.16" stroke="#2ea043" stroke-width="1"/>
      <circle cx="17" cy="15" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" class="mono status-text">TEST PIPELINE: PASS</text>
    </g>
  </g>

  <!-- Right: Testing Pipeline Terminal -->
  <g transform="translate(560, 44)">
    <rect width="250" height="128" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect width="250" height="26" rx="8" fill="#161b22" />
    <rect width="250" height="8" fill="#161b22" y="18" />
    <circle cx="14" cy="13" r="3.5" fill="#f85149" />
    <circle cx="26" cy="13" r="3.5" fill="#e3b341" />
    <circle cx="38" cy="13" r="3.5" fill="#2ea043" />
    <text x="52" y="17" class="mono win-label">qa-pipeline.yml</text>

    <g transform="translate(16, 44)">
      <circle cx="6" cy="6" r="4" fill="#388bfd" />
      <text x="18" y="10" class="mono row-label">Unit &amp; Schema</text>
      <text x="212" y="10" class="mono row-val" text-anchor="end">✓ 100%</text>
      <line x1="6" y1="27" x2="6" y2="31" stroke="#30363d" stroke-width="1.5" />

      <circle cx="6" cy="38" r="4" fill="#388bfd" />
      <text x="18" y="42" class="mono row-label">API Regression</text>
      <text x="212" y="42" class="mono row-val" text-anchor="end">✓ 42/42</text>
      <line x1="6" y1="59" x2="6" y2="63" stroke="#30363d" stroke-width="1.5" />

      <circle cx="6" cy="70" r="4" fill="#2ea043" />
      <text x="18" y="74" class="mono row-label">E2E Playwright</text>
      <text x="212" y="74" class="mono row-val" text-anchor="end">✓ PASS</text>
    </g>
  </g>
</svg>
