<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .kicker { fill: #58a6ff; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
      .title { fill: #ffffff; font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
      .tagline { fill: #8b949e; font-size: 13.5px; font-weight: 400; }
      .badge-txt { fill: #c9d1d9; font-size: 11px; font-weight: 600; }
      .status-txt { fill: #3fb950; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .meta-label { fill: #8b949e; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .meta-val { fill: #f0f6fc; font-size: 11.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="850" height="210" rx="10" fill="url(#header-bg)" stroke="#30363d" stroke-width="1" />

  <!-- Left: Identity & Specialization -->
  <g transform="translate(36, 34)">
    <!-- Role Kicker -->
    <text x="0" y="10" class="mono kicker">QUALITY ASSURANCE &amp; TEST AUTOMATION</text>

    <!-- Name -->
    <text x="0" y="46" class="sans title">Arrofi Zein Abdillah</text>

    <!-- Tagline grounded in LinkedIn reality -->
    <text x="0" y="74" class="sans tagline">QA Tester at WISECON · Linux Enthusiast · API &amp; End-to-End Test Automation</text>

    <!-- Professional Skill Badges -->
    <g transform="translate(0, 96)">
      <g transform="translate(0, 0)">
        <rect width="180" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="10" y="17" class="mono badge-txt">Playwright · Pytest · Postman</text>
      </g>

      <g transform="translate(190, 0)">
        <rect width="176" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="10" y="17" class="mono badge-txt">OpenAPI Contracts · CI/CD</text>
      </g>

      <g transform="translate(376, 0)">
        <rect width="144" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="10" y="17" class="mono badge-txt">Linux / Terminal Native</text>
      </g>
    </g>
  </g>

  <!-- Right: Professional Card (HRD & Recruiter Friendly) -->
  <g transform="translate(584, 26)">
    <rect width="230" height="158" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

    <!-- Availability Status -->
    <g transform="translate(16, 20)">
      <circle cx="5" cy="5" r="4" fill="#3fb950" />
      <text x="16" y="9" class="mono status-txt">OPEN TO OPPORTUNITIES</text>
    </g>

    <line x1="16" y1="36" x2="214" y2="36" stroke="#21262d" stroke-width="1" />

    <!-- Current Role & Company -->
    <g transform="translate(16, 52)">
      <text x="0" y="0" class="sans meta-label">Current Role</text>
      <text x="0" y="15" class="sans meta-val">QA Tester at WISECON</text>
    </g>

    <!-- Location -->
    <g transform="translate(16, 88)">
      <text x="0" y="0" class="sans meta-label">Location</text>
      <text x="0" y="15" class="sans meta-val">Jakarta, Indonesia</text>
    </g>

    <!-- Education / Origin -->
    <g transform="translate(16, 124)">
      <text x="0" y="0" class="sans meta-label">Education</text>
      <text x="0" y="15" class="sans meta-val">SMK Negeri 1 Jakarta</text>
    </g>
  </g>
</svg>
