<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .text-title { fill: #f0f6fc; font-size: 20px; font-weight: 700; }
      .text-sub { fill: #8b949e; font-size: 13px; }
      .text-prompt { fill: #58a6ff; font-size: 13px; font-weight: 600; }
      .text-cmd { fill: #f0f6fc; font-size: 13px; }
      .text-pass { fill: #3fb950; font-size: 12px; font-weight: 600; }
      .text-file { fill: #c9d1d9; font-size: 12px; }
      .text-meta { fill: #8b949e; font-size: 11px; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="190" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Header Bar -->
  <rect width="850" height="30" rx="8" fill="#161b22" />
  <rect y="22" width="850" height="8" fill="#161b22" />
  <line x1="0" y1="30" x2="850" y2="30" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="18" cy="15" r="4" fill="#f85149" />
  <circle cx="32" cy="15" r="4" fill="#e3b341" />
  <circle cx="46" cy="15" r="4" fill="#2ea043" />
  <text x="70" y="19" class="mono text-meta">zsh — test-suite-runner — 80x24</text>

  <!-- Left: Real Test Runner Output -->
  <g transform="translate(24, 48)">
    <!-- Command Line -->
    <text x="0" y="14" class="mono text-prompt">$ <tspan class="text-cmd">pytest --contract &amp;&amp; playwright test</tspan></text>
    
    <!-- Test Results -->
    <g transform="translate(0, 32)">
      <text x="0" y="12" class="mono text-pass">PASS</text>
      <text x="46" y="12" class="mono text-file">tests/api_contract/test_openapi_schema.py</text>
      <text x="440" y="12" class="mono text-meta">(14 passed)</text>

      <text x="0" y="32" class="mono text-pass">PASS</text>
      <text x="46" y="32" class="mono text-file">tests/e2e/portfolio_navigation.spec.ts</text>
      <text x="440" y="32" class="mono text-meta">(8 passed)</text>

      <text x="0" y="52" class="mono text-pass">PASS</text>
      <text x="46" y="52" class="mono text-file">tests/a11y/wcag_aa_audit.spec.ts</text>
      <text x="440" y="52" class="mono text-meta">(0 violations · axe-core)</text>
    </g>

    <!-- Cursor line -->
    <g transform="translate(0, 102)">
      <text x="0" y="12" class="mono text-prompt">$ <tspan class="text-meta">ready for deployment</tspan></text>
      <rect x="180" y="1" width="7" height="13" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="570" y1="42" x2="570" y2="175" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Right: Identity Stamp -->
  <g transform="translate(600, 52)">
    <text x="0" y="24" class="sans text-title">Arrofi Zein</text>
    <text x="0" y="44" class="mono text-sub">QA &amp; Test Automation</text>
    
    <g transform="translate(0, 64)">
      <rect width="210" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
      <text x="24" y="16" class="mono text-meta">status: shipping stable builds</text>
    </g>

    <g transform="translate(0, 96)">
      <text x="0" y="12" class="mono text-meta">stack: Playwright · Pytest · Vitest</text>
    </g>
  </g>
</svg>
